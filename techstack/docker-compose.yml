# MemWault containerised stack.
#
# Note: "Show in Folder" and the Instagram browser login cannot work in here.
# They need a desktop session to open a window on; containers have neither a
# file manager nor a display. Those endpoints return HTTP 501 with an
# explanation when MEMWAULT_IN_CONTAINER is set. Run the backend on your host
# (techstack/backend) if you need them.

# Shared backend configuration. Every variable needs the MEMWAULT_ prefix -
# app/config.py sets env_prefix="MEMWAULT_", so unprefixed names are ignored.
x-backend-env: &backend-env
  MEMWAULT_DEBUG: "true"
  MEMWAULT_IN_CONTAINER: "true"
  # Change this before exposing the stack anywhere: it signs the login JWTs.
  MEMWAULT_SECRET_KEY: change-me-to-a-random-secret-key-in-production
  # Without these two the stack would quietly run on SQLite + local disk while
  # Postgres and MinIO idled unused, because config.py defaults to sqlite/local.
  MEMWAULT_DATABASE_TYPE: postgres
  MEMWAULT_STORAGE_TYPE: s3
  MEMWAULT_POSTGRES_HOST: postgres
  MEMWAULT_POSTGRES_PORT: "5432"
  MEMWAULT_POSTGRES_USER: memwault
  MEMWAULT_POSTGRES_PASSWORD: memwault_dev_password
  MEMWAULT_POSTGRES_DB: memwault
  MEMWAULT_REDIS_URL: redis://redis:6379/0
  # Defaults to true, which makes Celery use an in-memory broker and run tasks
  # inline in the API process - leaving the worker and beat containers idle.
  MEMWAULT_CELERY_ALWAYS_EAGER: "false"
  MEMWAULT_S3_ENDPOINT_URL: http://minio:9000
  MEMWAULT_S3_ACCESS_KEY: minioadmin
  MEMWAULT_S3_SECRET_KEY: minioadmin
  MEMWAULT_S3_BUCKET_NAME: memwault-media

services:
  # ── PostgreSQL Database ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: memwault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memwault
      POSTGRES_PASSWORD: memwault_dev_password
      POSTGRES_DB: memwault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memwault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery Broker) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: memwault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-Compatible Object Storage) ─────────────
  minio:
    image: minio/minio:latest
    container_name: memwault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── MemWault Backend API ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memwault-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # ── Celery Worker (Background Scraper) ───────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memwault-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: celery -A app.scraper.tasks worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes:
      - ./backend:/app

  # ── Celery Beat (Cron Scheduler) ─────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memwault-beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.scraper.tasks beat --loglevel=info
    environment: *backend-env
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  minio_data:
