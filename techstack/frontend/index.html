<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="MemWault — A portable, user-owned digital memory archive. Preserve your Instagram stories forever with full metadata, music, and layout data." />
    <meta name="theme-color" content="#0050EF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MemWault" />
    <meta name="application-name" content="MemWault" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="icon" type="image/svg+xml" href="/memwault-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Orbitron:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:wght@300;400;500;700&family=Share+Tech+Mono&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <title>MemWault</title>
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('memwault_settings') || '{}');
          var theme = s.theme || 'dark';
          var themeId = s.themeId || (s.designPhilosophy === 'skeuomorphic' ? 'vault-classic' : (s.designPhilosophy === 'modern' ? 'basic' : 'darkroom'));
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-id', themeId);
          document.documentElement.setAttribute('data-design', (themeId === 'basic' || themeId === 'ios7' || themeId === 'material' || themeId === 'insta2016') ? 'modern' : 'skeuomorphic');
          if (s.grainIntensity !== undefined) document.documentElement.style.setProperty('--mat-grain-opacity', s.grainIntensity);
          if (s.patinaLevel !== undefined) document.documentElement.style.setProperty('--mat-patina-opacity', s.patinaLevel);
          if (s.crtMode) document.documentElement.setAttribute('data-crt', 'true');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Hidden procedural SVG noise filter definitions -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
      <defs>
        <filter id="mw-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="noise" />
          <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.08 0" />
          <feComposite in2="SourceGraphic" in="glint" operator="in" />
        </filter>
        <filter id="mw-paper-grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="paperNoise" />
          <feDiffuseLighting in="paperNoise" lighting-color="#fff" surfaceScale="1.2" result="light">
            <feDistantLight azimuth="45" elevation="60" />
          </feDiffuseLighting>
          <feBlend mode="multiply" in="SourceGraphic" in2="light" />
        </filter>
      </defs>
    </svg>

    <div id="root">
      <div style="min-height: 100vh; background-color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #FFFFFF;">
        <div style="width: 48px; height: 48px; margin-bottom: 20px; border-radius: 8px; background: #0050EF; display: flex; align-items: center; justify-content: center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px;">MemWault</div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 24px;">Pocket Companion</div>
        <div style="width: 140px; height: 3px; background: #1C1C1C; border-radius: 2px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; height: 100%; width: 45%; background: #0050EF; border-radius: 2px; animation: mw-load 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes mw-load {
            0% { left: -45%; }
            50% { left: 40%; width: 55%; }
            100% { left: 100%; width: 45%; }
          }
        </style>
      </div>
    </div>
    <script>
      // Clear stale service worker caches on localhost to ensure newest code is always loaded
      if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
