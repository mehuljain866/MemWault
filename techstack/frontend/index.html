<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/memwault-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MemWault — A portable, user-owned digital memory archive. Preserve your Instagram stories forever with full metadata, music, and layout data." />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <title>MemWault — Memory Archive</title>
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('memwault_settings') || '{}');
          if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
          if (s.designPhilosophy) document.documentElement.setAttribute('data-design', s.designPhilosophy);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
